server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and sets X-Forwarded-*; these are the headers that
    # still have to come from the origin.
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml font/woff2;

    # Container-level liveness probe; never cached, never logged.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document must always be revalidated or a deploy goes unnoticed.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
