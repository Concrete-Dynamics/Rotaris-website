server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and sets X-Forwarded-*; these are the headers that
    # still have to come from the origin.
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # Container-level liveness probe; never cached, never logged.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The client-side routes. Keep in step with src/data/routes.ts — a route
    # missing here still renders, but it answers 404 instead of 200.
    #
    # The optional (de|en)/ prefix is the locale, per src/i18n/config.ts. The
    # bare prefixes are matched too, because /de is the German homepage.
    location ~ ^/(de|en)/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~ ^/((de|en)/)?(imprint|privacy|terms|eula|acceptable-use|impressum|datenschutz|datenschutzerklaerung|agb|endnutzerbedingungen|nutzungsrichtlinie)/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # The entry document must always be revalidated or a deploy goes unnoticed.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Unknown paths still get the app shell, so the 404 page is the designed one
    # — but with a real 404 status, so crawlers do not index them. Without the
    # `=` this preserves the original status rather than rewriting it to 200.
    error_page 404 /index.html;
}
