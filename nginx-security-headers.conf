# Included into every location block that sets its own add_header — nginx
# discards inherited headers as soon as a block adds one of its own, so these
# have to be repeated rather than declared once at server level.
add_header X-Content-Type-Options "nosniff"                          always;
add_header X-Frame-Options        "SAMEORIGIN"                       always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
