name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rotaris-website:ci

      # Catches nginx.conf mistakes, which only surface when the server starts.
      - name: Smoke-test the image
        run: |
          docker run --rm --detach --name smoke --publish 8080:8080 rotaris-website:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 2
          done

          check() {  # path, expected status
            actual=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")
            echo "  $1 -> $actual (want $2)"
            [ "$actual" = "$2" ]
          }

          check /healthz 200
          check / 200
          check /imprint 200
          check /privacy 200
          # The German locale, and the explicit English alias.
          check /de 200
          check /de/privacy 200
          check /de/impressum 200
          check /en 200
          check /terms 200
          check /robots.txt 200
          check /sitemap.xml 200
          # Unknown paths must answer 404, not a soft 404.
          check /no-such-page 404

          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q '^Allow: /$'
          docker stop smoke
