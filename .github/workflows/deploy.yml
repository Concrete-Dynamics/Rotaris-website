name: Deploy

# Every push to main builds a new image and asks Portainer to redeploy the
# stack. Manual runs are allowed for redeploying without a code change.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `main` is the moving tag the Portainer stack pulls; `sha-…` pins a
          # specific build for rollback.
          tags: |
            type=raw,value=main
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: Trigger Portainer redeploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # PORTAINER_WEBHOOK_URL is the stack webhook Portainer generates under
      # Stack details → Webhooks. Hitting it re-pulls the image and recreates
      # the service. It is a secret because the URL alone authorises a redeploy.
      - name: Call the stack webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          status=$(curl --silent --show-error --location \
                        --request POST "$WEBHOOK_URL" \
                        --retry 3 --retry-delay 5 --retry-all-errors \
                        --max-time 120 \
                        --output /tmp/portainer-response.txt \
                        --write-out '%{http_code}')

          echo "Portainer responded with HTTP $status"
          cat /tmp/portainer-response.txt || true

          case "$status" in
            2*) echo "Redeploy accepted." ;;
            *)  echo "::error::Portainer redeploy failed with HTTP $status"; exit 1 ;;
          esac

  verify:
    name: Verify the deployed site
    needs: redeploy
    runs-on: ubuntu-latest
    # Optional: set the PUBLIC_URL repository variable to have CI confirm the
    # new build is actually being served.
    if: vars.PUBLIC_URL != ''
    steps:
      - name: Wait for the site to answer
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.PUBLIC_URL }}" || echo 000)
            echo "attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::${{ vars.PUBLIC_URL }} did not return 200 within ~200s"
          exit 1
