name: Deploy

# Every push to main builds a new image and asks Portainer to redeploy the
# stack. Manual runs are allowed for redeploying without a code change.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `main` is the moving tag the Portainer stack pulls; `sha-…` pins a
          # specific build for rollback.
          tags: |
            type=raw,value=main
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Do not ask Portainer to redeploy an image that will not start.
      - name: Smoke-test the pushed image
        run: |
          # github.repository preserves the owner's capitalisation; Docker
          # references must be lowercase.
          repo=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${repo}@${{ steps.build.outputs.digest }}"
          docker run --rm --detach --name smoke --publish 8080:8080 "$image"
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 2
          done

          check() {  # path, expected status
            actual=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")
            echo "  $1 -> $actual (want $2)"
            [ "$actual" = "$2" ]
          }

          check /healthz 200
          check / 200
          check /imprint 200
          check /privacy 200
          # The German locale, and the explicit English alias.
          check /de 200
          check /de/privacy 200
          check /de/impressum 200
          check /en 200
          check /terms 200
          check /robots.txt 200
          check /sitemap.xml 200
          # Unknown paths must answer 404, not a soft 404.
          check /no-such-page 404

          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q '^Allow: /$'
          docker stop smoke

  redeploy:
    name: Trigger Portainer redeploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # PORTAINER_WEBHOOK_URL is the stack webhook Portainer generates under
      # Stack details → Webhooks. Hitting it re-pulls the image and recreates
      # the service. It is a secret because the URL alone authorises a redeploy.
      - name: Call the stack webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          status=$(curl --silent --show-error --location \
                        --request POST "$WEBHOOK_URL" \
                        --retry 3 --retry-delay 5 --retry-all-errors \
                        --max-time 120 \
                        --output /tmp/portainer-response.txt \
                        --write-out '%{http_code}')

          echo "Portainer responded with HTTP $status"
          cat /tmp/portainer-response.txt || true

          case "$status" in
            2*) echo "Redeploy accepted." ;;
            *)  echo "::error::Portainer redeploy failed with HTTP $status"; exit 1 ;;
          esac

  verify:
    name: Verify the deployed site
    needs: redeploy
    runs-on: ubuntu-latest
    # Runs once the SITE_URL repository variable points at the live site;
    # the same variable stamps the canonical URLs into the build.
    if: vars.SITE_URL != ''
    steps:
      - name: Wait for the site to answer
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.SITE_URL }}" || echo 000)
            echo "attempt $attempt: HTTP $status"
            # 401 means Traefik and the container are both up and the basic-auth
            # gate is doing its job, which is just as good a liveness signal.
            case "$status" in
              200|401) echo "Site is serving (HTTP $status)."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::${{ vars.SITE_URL }} did not answer 200 or 401 within ~200s"
          exit 1
