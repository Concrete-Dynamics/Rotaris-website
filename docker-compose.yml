# Portainer stack file for the Rotaris website.
#
# Deploy in Portainer as: Stacks → Add stack → Repository
#   Repository URL        https://github.com/Concrete-Dynamics/Rotaris-website
#   Compose path          docker-compose.yml
#   Environment           load from .stack.env
#   Automatic updates     enable the stack webhook, then copy the generated URL
#                         into the PORTAINER_WEBHOOK_URL repository secret
#
# The Traefik entrypoint, network and certresolver names match the reverse proxy
# this stack is deployed behind. Every value carries a default, so the stack
# still comes up if Portainer is not pointed at .stack.env — the env file
# overrides, it is not a prerequisite. Labels use list syntax because Compose
# only interpolates variables inside values, not inside mapping keys.

services:
  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/concrete-dynamics/rotaris-website}:${IMAGE_TAG:-main}
    container_name: ${STACK_NAME:-rotaris-website}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # The image runs as uid 101 with a read-only root; nginx still needs
      # somewhere to put its pid file and scratch buffers.
      - /tmp
      - /var/cache/nginx
    expose:
      - "8080"
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # ── Traefik ────────────────────────────────────────────────────────────
      # TRAEFIK_RULE carries the host rule; see .stack.env.
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_net}"

      # Router. The `https` entrypoint terminates TLS; the Traefik instance
      # already redirects plain HTTP, so there is no second router here.
      - "traefik.http.routers.${TRAEFIK_ROUTER:-rotaris-website}.rule=${TRAEFIK_RULE:-Host(`rotaris.ai`)}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-rotaris-website}.entrypoints=${TRAEFIK_ENTRYPOINT:-https}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-rotaris-website}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-rotaris-website}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-simpleresolver}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-rotaris-website}.service=${TRAEFIK_ROUTER:-rotaris-website}"
      # BASIC_AUTH is spliced into the middleware *name*, which is the only way
      # to make a Compose label conditional: `true` selects the basicauth
      # middleware, `false` selects the no-op below. Both are always defined, so
      # the router never points at something that does not exist.
      - "traefik.http.routers.${TRAEFIK_ROUTER:-rotaris-website}.middlewares=${TRAEFIK_ROUTER:-rotaris-website}-compress@docker,${TRAEFIK_ROUTER:-rotaris-website}-auth-${BASIC_AUTH:-false}@docker"

      # Service
      - "traefik.http.services.${TRAEFIK_ROUTER:-rotaris-website}.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT:-8080}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-rotaris-website}.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.${TRAEFIK_ROUTER:-rotaris-website}.loadbalancer.healthcheck.interval=30s"

      # Middlewares
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-rotaris-website}-compress.compress=true"

      # ── HTTP basic auth ────────────────────────────────────────────────────
      # Selected when BASIC_AUTH=true. Traefik needs htpasswd-hashed passwords;
      # see BASIC_AUTH_USERS in .stack.env for how to generate one.
      # removeheader stops the Authorization header from reaching nginx.
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-rotaris-website}-auth-true.basicauth.users=${BASIC_AUTH_USERS:-}"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-rotaris-website}-auth-true.basicauth.realm=${BASIC_AUTH_REALM:-Rotaris}"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-rotaris-website}-auth-true.basicauth.removeheader=true"

      # Selected when BASIC_AUTH=false. Setting a request header the app ignores
      # is the cheapest middleware that does nothing.
      - "traefik.http.middlewares.${TRAEFIK_ROUTER:-rotaris-website}-auth-false.headers.customrequestheaders.X-Rotaris-Auth=disabled"

      # ── Housekeeping ───────────────────────────────────────────────────────
      - "org.opencontainers.image.source=https://github.com/Concrete-Dynamics/Rotaris-website"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik_net}
    external: true
