# Portainer stack file for the Rotaris website.
#
# Deploy in Portainer as: Stacks → Add stack → Repository
#   Repository URL        https://github.com/Concrete-Dynamics/Rotaris-website
#   Compose path          docker-compose.yml
#   Environment           load from .stack.env
#   Automatic updates     enable the stack webhook, then copy the generated URL
#                         into the PORTAINER_WEBHOOK_URL repository secret
#
# Every value below comes from .stack.env, so the stack can be retargeted
# (different host, entrypoint, or image tag) without editing this file. Labels
# use list syntax because Compose only interpolates variables inside values —
# not inside mapping keys.

services:
  web:
    image: ${IMAGE_REPOSITORY}:${IMAGE_TAG}
    container_name: ${STACK_NAME}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # The image runs as uid 101 with a read-only root; nginx still needs
      # somewhere to put its pid file and scratch buffers.
      - /tmp
      - /var/cache/nginx
    expose:
      - "8080"
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # ── Traefik ────────────────────────────────────────────────────────────
      # Placeholders live in .stack.env — point TRAEFIK_HOST at the real domain
      # and match the entrypoint/certresolver names of the Traefik instance
      # before the first production deploy.
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"

      # HTTPS router
      - "traefik.http.routers.${TRAEFIK_ROUTER}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_ROUTER}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.middlewares=${TRAEFIK_ROUTER}-headers@docker,${TRAEFIK_ROUTER}-compress@docker"

      # Plain-HTTP router, permanently redirected to HTTPS
      - "traefik.http.routers.${TRAEFIK_ROUTER}-http.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER}-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}-http.middlewares=${TRAEFIK_ROUTER}-to-https@docker"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-to-https.redirectscheme.permanent=true"

      # Service
      - "traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=${TRAEFIK_SERVICE_PORT}"
      - "traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.healthcheck.interval=30s"

      # Middlewares
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-compress.compress=true"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-headers.headers.stsSeconds=${TRAEFIK_HSTS_SECONDS}"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-headers.headers.stsPreload=false"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER}-headers.headers.contentTypeNosniff=true"

      # ── Housekeeping ───────────────────────────────────────────────────────
      - "org.opencontainers.image.source=https://github.com/Concrete-Dynamics/Rotaris-website"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
